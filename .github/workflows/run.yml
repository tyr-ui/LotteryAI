name: Run LotteryAI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    # JST 21:30 = UTC 12:30
    # Monday/Thursday: Loto6
    # Tuesday: Mini Loto
    # Friday: Loto7
    - cron: "30 12 * * 1,2,4,5"

    # JST 23:30 = UTC 14:30
    # Retry after data source update delay
    - cron: "30 14 * * 1,2,4,5"

    # JST next morning 08:30 = UTC 23:30
    # Final retry after overnight data source update
    - cron: "30 23 * * 1,2,4,5"

permissions:
  contents: write

jobs:
  quick-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q src

      - name: Check module imports
        env:
          PYTHONPATH: src
        run: |
          python -c "import games, main, optimizer, review_output, run_pipeline"

  full-run:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LotteryAI pipeline
        run: |
          python src/run_pipeline.py

      - name: Commit output files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/optimizer_result.json
          git add output/prediction_optimizer_loto6.json
          git add output/prediction_optimizer_loto7.json
          git add output/prediction_optimizer_miniloto.json
          git add output/evaluation_history.json
          git add output/evaluation_summary.json
          git add output/run_summary.json
          git add output/review_bundle.json

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update LotteryAI output [skip ci]"
            git push
          fi

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-review
          path: |
            output/run_summary.json
            output/review_bundle.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload all output files
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-output
          path: output/
          if-no-files-found: error
          retention-days: 30