name: LotteryAI 自動予測

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "全ゲームを再計算する（通常はOFF）"
        required: false
        default: false
        type: boolean
      send_notification:
        description: "実行完了後にDiscordへ通知する"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main

  schedule:
    # 日本時間21:30（UTC 12:30）
    # 月曜・木曜：ロト6
    # 火曜：ミニロト
    # 金曜：ロト7
    - cron: "30 12 * * 1,2,4,5"

    # 日本時間23:30（UTC 14:30）
    # データ公開が遅れた場合の再確認
    - cron: "30 14 * * 1,2,4,5"

    # 日本時間 翌朝8:30（UTC 23:30）
    # 翌朝の最終確認
    - cron: "30 23 * * 1,2,4,5"

permissions:
  contents: write

jobs:
  quick-check:
    name: クイックチェック
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python構文を確認
        run: |
          python -m compileall -q src

      - name: 主要モジュールの読み込みを確認
        env:
          PYTHONPATH: src
        run: |
          python -c "import games, main, optimizer, review_output, run_pipeline"

      - name: テストを実行
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  full-run:
    name: 本番予測
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: lotteryai-full-run
      cancel-in-progress: false

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 更新されたゲームを判定して予測・評価
        id: pipeline
        env:
          LOTTERY_RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all == true && 'all' || 'auto' }}
        run: |
          python src/run_pipeline.py

      - name: 出力ファイルの変更を確認
        id: output_changes
        run: |
          git add output/ data/raw/

          if git diff --cached --quiet; then
            echo "出力・取得データに変更はありません。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "出力・取得データの変更を検出しました。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discordへ通知
        if: >-
          steps.pipeline.outcome == 'success' &&
          (
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.send_notification == true
            ) ||
            (
              github.event_name == 'schedule' &&
              steps.output_changes.outputs.changed == 'true'
            )
          )
        env:
          PYTHONPATH: src
          LOTTERY_DISCORD_WEBHOOK: ${{ secrets.LOTTERY_DISCORD_WEBHOOK }}
        run: |
          python src/notifier.py output/notification_payload.json

      - name: 予測結果と取得データを保存
        if: steps.output_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update LotteryAI output and data cache [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: レビュー用ファイルを保存
        if: always() && steps.pipeline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-review
          path: |
            output/run_summary.json
            output/review_bundle.json
          if-no-files-found: error
          retention-days: 30

      - name: 出力ファイル一式を保存
        if: always() && steps.pipeline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-output
          path: output/
          if-no-files-found: error
          retention-days: 30
