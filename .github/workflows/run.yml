name: Run LotteryAI

on:
  workflow_dispatch:
    inputs:
      send_notification:
        description: "Send Discord notification after a successful run"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main

  schedule:
    # JST 21:30 = UTC 12:30
    # Monday/Thursday: Loto6
    # Tuesday: Mini Loto
    # Friday: Loto7
    - cron: "30 12 * * 1,2,4,5"

    # JST 23:30 = UTC 14:30
    # Retry after data source update delay
    - cron: "30 14 * * 1,2,4,5"

    # JST next morning 08:30 = UTC 23:30
    # Final retry after overnight data source update
    - cron: "30 23 * * 1,2,4,5"

permissions:
  contents: write

jobs:
  quick-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q src

      - name: Check module imports
        env:
          PYTHONPATH: src
        run: |
          python -c "import games, main, optimizer, review_output, run_pipeline"

      - name: Check prediction output contract
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  full-run:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LotteryAI pipeline
        run: |
          python src/run_pipeline.py

      - name: Commit output files
        id: output_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update LotteryAI output [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Discord notification
        if: >-
          steps.output_changes.outputs.changed == 'true' &&
          (
            github.event_name == 'schedule' ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.send_notification == true
            )
          )
        env:
          PYTHONPATH: src
          LOTTERY_DISCORD_WEBHOOK: ${{ secrets.LOTTERY_DISCORD_WEBHOOK }}
        run: |
          python src/notifier.py output/notification_payload.json

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-review
          path: |
            output/run_summary.json
            output/review_bundle.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload all output files
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-output
          path: output/
          if-no-files-found: error
          retention-days: 30