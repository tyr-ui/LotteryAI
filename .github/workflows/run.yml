name: Run LotteryAI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LotteryAI optimizer
        run: |
          python src/optimizer.py

      - name: Commit output files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/optimizer_result.json
          git add output/prediction_optimizer_loto6.json
          git add output/prediction_optimizer_loto7.json

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update optimizer output [skip ci]"
            git push
          fi

      - name: Upload output files
        uses: actions/upload-artifact@v4
        with:
          name: lotteryai-output
          path: output/